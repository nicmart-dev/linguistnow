# Dependabot configuration - Security Monitoring Only
#
# Version updates across npm, GitHub Actions, and Docker are managed by Renovate
# (see renovate.json) with automated gating, cooldowns, and automerge.
#
# Dependabot is configured here for security monitoring only (open-pull-requests-limit: 0
# prevents routine version PRs while retaining automated security alerts and security PRs).
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Monorepo npm dependencies - security monitoring only
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # GitHub Actions workflows - security monitoring only
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # Docker images for client - security monitoring only
  - package-ecosystem: "docker"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # Docker images for server - security monitoring only
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
