name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-dependencies:
    runs-on: ubuntu-24.04
    outputs:
      has_updates: ${{ steps.outdated.outputs.has_updates }}
      has_changes: ${{ steps.update.outputs.has_changes }}
      branch_exists: ${{ steps.update.outputs.branch_exists }}
      branch_name: ${{ steps.update.outputs.branch_name }}
      pr_url: ${{ steps.create-pr.outputs.pr_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Never persist a token in .git/config: later steps resolve and touch
          # freshly published third-party packages. The push token is passed
          # only to the dedicated "Push branch" step below.
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.2

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        # --ignore-scripts: this job only rewrites manifests/lockfile, so no
        # dependency lifecycle (postinstall) scripts need to run here.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check for outdated dependencies
        id: outdated
        run: |
          echo "Checking for outdated dependencies..."
          
          # Capture outdated packages (pnpm outdated returns exit 1 if outdated packages exist)
          # Normalize empty output to "{}" and use jq to check JSON length
          set +e
          CLIENT_OUTDATED=$(cd client && pnpm outdated --format json 2>/dev/null || echo "")
          SERVER_OUTDATED=$(cd server && pnpm outdated --format json 2>/dev/null || echo "")
          ROOT_OUTDATED=$(pnpm outdated --format json 2>/dev/null || echo "")
          set -e
          
          # Normalize empty strings to "{}"
          CLIENT_OUTDATED=${CLIENT_OUTDATED:-"{}"}
          SERVER_OUTDATED=${SERVER_OUTDATED:-"{}"}
          ROOT_OUTDATED=${ROOT_OUTDATED:-"{}"}
          
          # Check JSON length using jq (0 means empty object, >0 means updates available)
          CLIENT_LEN=$(echo "$CLIENT_OUTDATED" | jq 'length' 2>/dev/null || echo "0")
          SERVER_LEN=$(echo "$SERVER_OUTDATED" | jq 'length' 2>/dev/null || echo "0")
          ROOT_LEN=$(echo "$ROOT_OUTDATED" | jq 'length' 2>/dev/null || echo "0")
          
          # Check if there are any updates (length > 0 means updates available)
          if [ "$CLIENT_LEN" = "0" ] && [ "$SERVER_LEN" = "0" ] && [ "$ROOT_LEN" = "0" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No dependency updates available."
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Updates available!"
          fi

      - name: Close superseded dependency PRs
        if: steps.outdated.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Close any older open dependency update PRs to prevent stale PR accumulation
          echo "Checking for superseded dependency update PRs..."
          OLD_PRS=$(gh pr list --state open --label "dependencies" --json number,headRefName --jq '.[] | select(.headRefName | startswith("deps/update-")) | .number' 2>/dev/null || echo "")
          for pr in $OLD_PRS; do
            echo "Closing superseded dependency update PR #$pr..."
            gh pr close "$pr" --comment "Superseded by newer automated weekly dependency updates." --delete-branch || true
          done

      - name: Update dependencies
        if: steps.outdated.outputs.has_updates == 'true'
        id: update
        env:
          HUSKY: '0'
          # `pnpm update` has no --ignore-scripts flag; pnpm honours this config
          # env var, so no dependency lifecycle scripts run during the update.
          npm_config_ignore_scripts: 'true'
        run: |
          # Create branch name with date
          BRANCH_NAME="deps/update-$(date +%Y-%m-%d)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          # Check if branch already exists remotely
          if git ls-remote --heads origin "$BRANCH_NAME" | grep -q "$BRANCH_NAME"; then
            echo "Branch $BRANCH_NAME already exists, skipping..."
            echo "branch_exists=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "branch_exists=false" >> $GITHUB_OUTPUT
          
          git checkout -b "$BRANCH_NAME"
          
          # Capture before state
          echo "## 📦 Dependency Updates - $(date +%Y-%m-%d)" > /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          
          # Update client dependencies
          echo "### Client Updates" >> /tmp/pr_body.md
          echo '```' >> /tmp/pr_body.md
          cd client
          pnpm outdated 2>/dev/null || true
          pnpm update 2>&1 | tee -a /tmp/pr_body.md || true
          cd ..
          echo '```' >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          
          # Update server dependencies
          echo "### Server Updates" >> /tmp/pr_body.md
          echo '```' >> /tmp/pr_body.md
          cd server
          pnpm outdated 2>/dev/null || true
          pnpm update 2>&1 | tee -a /tmp/pr_body.md || true
          cd ..
          echo '```' >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          
          # Update root dependencies
          echo "### Root Updates" >> /tmp/pr_body.md
          echo '```' >> /tmp/pr_body.md
          pnpm update 2>&1 | tee -a /tmp/pr_body.md || true
          echo '```' >> /tmp/pr_body.md
          echo "" >> /tmp/pr_body.md
          
          # Add auto-generated notice
          echo "---" >> /tmp/pr_body.md
          echo "*This PR was automatically generated by the dependency-updates workflow.*" >> /tmp/pr_body.md
          echo "*It will auto-merge if all tests pass.*" >> /tmp/pr_body.md
          
          # Check if there are actual changes
          if git diff --quiet; then
            echo "No changes to commit."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            
            # Commit locally; pushing happens in the dedicated step below
            git add .
            git commit --no-verify -m "build(deps): update dependencies $(date +%Y-%m-%d)" -m "Automated dependency updates from weekly workflow."
          fi

      - name: Push branch
        if: steps.outdated.outputs.has_updates == 'true' && steps.update.outputs.has_changes == 'true' && steps.update.outputs.branch_exists == 'false'
        env:
          # RELEASE_TOKEN (not GITHUB_TOKEN) so the push triggers CI on the PR.
          # Scoped to this step only; no third-party code runs here.
          PUSH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.update.outputs.branch_name }}
        run: |
          git push --no-verify "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH_NAME}"

      - name: Create Pull Request and Enable Auto-Merge
        if: steps.outdated.outputs.has_updates == 'true' && steps.update.outputs.has_changes == 'true' && steps.update.outputs.branch_exists == 'false'
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --title "build(deps): automated dependency updates $(date +%Y-%m-%d)" \
            --body-file /tmp/pr_body.md \
            --base main \
            --head "${{ steps.update.outputs.branch_name }}" \
            --label "dependencies")

          echo "Created PR: $PR_URL"
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

          gh pr merge "$PR_URL" --auto --squash
