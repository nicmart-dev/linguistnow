# =============================================================================
# LinguistNow Docker Compose - Unified Stack Configuration
# =============================================================================
# PURPOSE: Tool-agnostic, production-ready Docker Compose configuration.
#          Works seamlessly with Dockhand, Dockge, Portainer, or the Docker CLI.
#
# SERVICES:
#   - backend:     Node.js Express API server
#   - frontend:    React application served via Nginx
#   - redis:       In-memory cache for FX rates & sessions
#   - frankfurter: Self-hosted ECB FX rates service
#
# OPTIONAL SERVICES (Local Dev / Profiles):
#   - vault:       Local development HashiCorp Vault (profile: dev)
#   - n8n:         Local development n8n workflow engine (profile: dev)
#
# USAGE:
#   1. Production (Pre-built GHCR images):
#      docker compose pull && docker compose up -d
#
#   2. Local Development (Build from source):
#      docker compose up -d --build
#
#   3. Local All-in-One (with local Vault and n8n):
#      COMPOSE_PROFILES=dev docker compose up -d --build
#
# NETWORKING:
#   Defaults to external network 'shared_net' (for cross-stack communication
#   with Vault, n8n, or reverse proxies). To use an isolated bridge network
#   locally without creating 'shared_net', set USE_EXTERNAL_NETWORK=false in
#   your .env or use docker-compose.override.yml.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend API Server (Node.js Express)
  # ---------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/nicmart-dev/linguistnow-backend:latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: linguistnow-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5050}:5000"
    environment:
      # Server Configuration
      - PORT=5000
      - NODE_ENV=${NODE_ENV:-production}

      # Frontend & Backend Public URLs
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3030}
      - BACKEND_URL=${BACKEND_URL:-http://localhost:5050}

      # Google OAuth Configuration
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-${FRONTEND_URL:-http://localhost:3030}}

      # Airtable Database Configuration
      - AIRTABLE_PERSONAL_ACCESS_TOKEN=${AIRTABLE_PERSONAL_ACCESS_TOKEN}
      - AIRTABLE_BASE_ID=${AIRTABLE_BASE_ID}

      # HashiCorp Vault Configuration
      - VAULT_ADDR=${VAULT_ADDR:-http://shared-vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
      - VAULT_SECRET_PATH=${VAULT_SECRET_PATH:-secret/data/linguistnow/tokens}

      # Redis Configuration (for FX rate caching)
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}

      # Frankfurter Configuration (for ECB FX rates)
      - FRANKFURTER_URL=${FRANKFURTER_URL:-http://frankfurter:8080}
      - FRANKFURTER_FALLBACK_URL=${FRANKFURTER_FALLBACK_URL:-https://api.frankfurter.dev/v1}
      # Internal API Key (Optional, for protecting internal/management endpoints)
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-${CURRENCY_REFRESH_API_KEY:-}}
      # Session Secret (Optional, persists login sessions across container restarts; min 32 chars)
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Reverse proxy trust hops (Optional, e.g. 1 if behind Nginx/Traefik/Cloudflare)
      - TRUST_PROXY=${TRUST_PROXY:-}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      frankfurter:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Frontend Application (React + Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/nicmart-dev/linguistnow-frontend:latest}
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5050}
        - VITE_BASE_URL=${VITE_BASE_URL:-http://localhost:3030}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID}}
    container_name: linguistnow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3030}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Redis (FX Rate Cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: linguistnow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Frankfurter (ECB FX Rates)
  # ---------------------------------------------------------------------------
  frankfurter:
    image: lineofflight/frankfurter:latest
    container_name: linguistnow-frankfurter
    restart: unless-stopped
    user: root
    ports:
      - "${FRANKFURTER_BIND_IP:-127.0.0.1}:${FRANKFURTER_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=sqlite:///app/data/frankfurter.sqlite3
      - FRANKFURTER_RETENTION_DAYS=${FRANKFURTER_RETENTION_DAYS:-90}
    volumes:
      - frankfurter-data:/app/data
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /app/data
        chmod 777 /app/data

        bundle exec ruby -e '
          retention_days = Integer(ENV.fetch("FRANKFURTER_RETENTION_DAYS", 90))
          providers_dir = "/app/db/seeds/providers"
          if Dir.exist?(providers_dir)
            Dir.glob("#{providers_dir}/*.json").each do |file|
              File.delete(file) unless File.basename(file) == "ecb.json"
            end

            ecb_file = "#{providers_dir}/ecb.json"
            if File.exist?(ecb_file)
              require "json"
              require "date"
              data = JSON.parse(File.read(ecb_file))
              data["coverage_start"] = (Date.today - retention_days).to_s
              File.write(ecb_file, JSON.pretty_generate(data))
            end
          end

          config_ru = "/app/config.ru"
          if File.exist?(config_ru)
            content = File.read(config_ru)
            unless content.include?("LegacyRewrite")
              middleware = %Q{
        class LegacyRewrite
          def initialize(app)
            @app = app
          end
          def call(env)
            path = env["PATH_INFO"]
            if path == "/latest" || path =~ %r{\\A/\\d{4}-\\d{2}-\\d{2}} || path == "/currencies"
              env["PATH_INFO"] = "/v1\#{path}"
            end
            @app.call(env)
          end
        end
        use LegacyRewrite
              }
              new_content = content.sub("run App.freeze.app", "\#{middleware}\nrun App.freeze.app")
              File.write(config_ru, new_content)
            end
          end

          schedule_file = "/app/bin/schedule"
          if File.exist?(schedule_file)
            content = File.read(schedule_file)
            unless content.include?("rates_prune")
              prune_job = %Q{
        unless dry_run
          scheduler.cron("0 1 * * *") do # rates_prune
            cutoff = (Date.today - Integer(ENV.fetch("FRANKFURTER_RETENTION_DAYS", 90))).to_s
            if DB.table_exists?(:rates)
              deleted = DB[:rates].where { date < cutoff }.delete
              Log.info("Pruned \#{deleted} rates older than \#{cutoff}") if deleted.positive?
            end
          end
        end
              }
              new_content = content.sub("scheduler.join unless dry_run", "\#{prune_job}\nscheduler.join unless dry_run")
              File.write(schedule_file, new_content)
            end
          end
        '
        bundle exec rake db:setup
        chmod 666 /app/data/frankfurter.sqlite3* 2>/dev/null || true
        bundle exec ruby -e '
          require_relative "boot"
          require "db"
          require "date"
          cutoff = (Date.today - Integer(ENV.fetch("FRANKFURTER_RETENTION_DAYS", 90))).to_s
          if DB.table_exists?(:rates)
            deleted = DB[:rates].where { date < cutoff }.delete
            puts "Pruned #{deleted} historical rates older than #{cutoff}" if deleted.positive?
          end
        '
        exec bundle exec foreman start
    healthcheck:
      test: ["CMD-SHELL", "ruby -rnet/http -e 'res = Net::HTTP.get_response(URI(\"http://localhost:8080/latest\")); exit(res.is_a?(Net::HTTPSuccess) ? 0 : 1)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # Optional Local Development Services (Profile: dev)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # n8n Workflow Automation (Dev Mock)
  # ---------------------------------------------------------------------------
  n8n:
    profiles: ["dev"]
    image: n8nio/n8n:latest
    container_name: linguistnow-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - WEBHOOK_URL=${N8N_EXTERNAL_URL:-http://localhost:5678}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Vancouver}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-}
      - N8N_PUBLIC_API_DISABLED=${N8N_PUBLIC_API_DISABLED:-false}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5678/healthz",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # HashiCorp Vault (Dev Mode)
  # ---------------------------------------------------------------------------
  vault:
    profiles: ["dev"]
    image: hashicorp/vault:latest
    container_name: linguistnow-vault
    restart: unless-stopped
    ports:
      - "${VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data
      - vault-logs:/vault/logs
      - ./vault/config:/vault/config:ro
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      default:
        aliases:
          - shared-vault

# =============================================================================
# Networks
# =============================================================================
networks:
  default:
    name: ${DOCKER_NETWORK_NAME:-shared_net}
    external: ${USE_EXTERNAL_NETWORK:-true}

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    name: linguistnow-redis-data
  frankfurter-data:
    name: linguistnow-frankfurter-data
  vault-data:
    name: linguistnow-vault-data
  vault-logs:
    name: linguistnow-vault-logs
  n8n_data:
    name: linguistnow-n8n-data